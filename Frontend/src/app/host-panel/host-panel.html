<section class="host-panel">
  <div class="host-panel-container">
    <div class="panel-header">
      <div class="header-content">
        <h1 class="panel-title">Manage Trips</h1>
        <p class="panel-subtitle">Lorem Ipsum generators on the Internet.</p>
      </div>
      <button class="create-trip-btn" (click)="navigateToCreateTrip()">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Create New Trip</span>
      </button>
    </div>
  </div>
</section>

<!-- Trips Tabs Navigation -->
<section class="trips-tabs-section" style="background: none">
  <div class="trips-tabs-container">
    <nav class="trips-tabs">
      <button
        class="tab-btn"
        [class.active]="activeTab === 'active'"
        (click)="setActiveTab('active')"
      >
        Active Trips
      </button>
      <button
        class="tab-btn"
        [class.active]="activeTab === 'pending'"
        (click)="setActiveTab('pending')"
      >
        Approval Pending
      </button>
      <button
        class="tab-btn"
        [class.active]="activeTab === 'rejected'"
        (click)="setActiveTab('rejected')"
      >
        Rejected
      </button>
      <!-- <button
        class="tab-btn"
        [class.active]="activeTab === 'drafts'"
        (click)="setActiveTab('drafts')"
      >
        Drafts
      </button> -->
      <button
        class="tab-btn"
        [class.active]="activeTab === 'past'"
        (click)="setActiveTab('past')"
      >
        Past Trips
      </button>
      <button
        class="tab-btn"
        [class.active]="activeTab === 'Trip Requests'"
        (click)="setActiveTab('Trip Requests')"
      >
        Trip Requests
      </button>
    </nav>
  </div>
</section>

<app-host-panel-trips [activeTab]="activeTab"/>
